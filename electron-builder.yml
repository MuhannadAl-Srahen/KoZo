appId: com.kozo.app
productName: KoZo
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - electron/**
  - node_modules/**
  - package.json
extraResources:
  - from: assets/
    to: assets/
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
npmRebuild: true
