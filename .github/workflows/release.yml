name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node stays for the toolchain (vite, electron-builder, gen-icon run on
      # Node); Bun replaces npm as the package manager — much faster installs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Unit tests, then the whole app on a throwaway profile (every page,
      # menus, controller, Big Picture). A failure stops the release. Bash, because it
      # stops at the first failed command: PowerShell here only checked the last one.
      - name: Test
        shell: bash
        run: |
          node scripts/test-parsers.js
          node scripts/test-backup-copy.js
          bunx electron-builder install-app-deps
          bunx vite build
          bunx electron scripts/smoke-test.js

      # KoZo's Google client for Drive sign-in, kept out of the public code
      # (docs/google-drive.md). The Google app is published, so a build without them
      # would hide Google sign-in from everyone: missing secrets stop the release.
      - name: Add the Google client
        env:
          KOZO_GOOGLE_CLIENT_ID: ${{ secrets.KOZO_GOOGLE_CLIENT_ID }}
          KOZO_GOOGLE_CLIENT_SECRET: ${{ secrets.KOZO_GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "const {KOZO_GOOGLE_CLIENT_ID:id,KOZO_GOOGLE_CLIENT_SECRET:secret}=process.env; if(!id||!secret){console.log('::error::The secrets KOZO_GOOGLE_CLIENT_ID and KOZO_GOOGLE_CLIENT_SECRET are not set, so this build would have no Google sign-in');process.exit(1)} require('fs').writeFileSync('electron/defaults.local.js','module.exports='+JSON.stringify({GOOGLE_CLIENT_ID:id,GOOGLE_CLIENT_SECRET:secret})+'\n');console.log('Google client added')"

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/gen-icon.js
          bunx vite build
          bunx electron-builder --publish always

      # KoZo's "What's new" after an update shows the GitHub release's text, and electron-builder
      # only puts build/release-notes.md in latest.yml. Notes that don't name this version are
      # last release's, so they're left off rather than shown again.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if head -n 1 build/release-notes.md | tr -d '\r' | grep -q "^KoZo ${version}\$"; then
            gh release edit "$GITHUB_REF_NAME" --notes-file build/release-notes.md
          else
            echo "::warning::build/release-notes.md is not for ${version}, so the release has no notes"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kozo-windows-release
          path: release/**