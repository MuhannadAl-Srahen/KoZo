name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node stays for the toolchain (vite, electron-builder, gen-icon run on
      # Node); Bun replaces npm as the package manager — much faster installs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/gen-icon.js
          bunx vite build
          bunx electron-builder --publish always

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kozo-windows-release
          path: release/**