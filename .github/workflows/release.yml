name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node stays for the toolchain (vite, electron-builder, gen-icon run on
      # Node); Bun replaces npm as the package manager — much faster installs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Unit tests, then the whole app on a throwaway profile (every page,
      # menus, controller, Big Picture). A failure stops the release.
      - name: Test
        run: |
          node scripts/test-parsers.js
          node scripts/test-backup-copy.js
          bunx electron-builder install-app-deps
          bunx vite build
          bunx electron scripts/smoke-test.js

      # KoZo's Google client for Drive sign-in, kept out of the public code. With
      # no secrets set, the build simply has no Google row (docs/google-drive.md).
      - name: Add the Google client
        env:
          KOZO_GOOGLE_CLIENT_ID: ${{ secrets.KOZO_GOOGLE_CLIENT_ID }}
          KOZO_GOOGLE_CLIENT_SECRET: ${{ secrets.KOZO_GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "const {KOZO_GOOGLE_CLIENT_ID:id,KOZO_GOOGLE_CLIENT_SECRET:secret}=process.env; if(id&&secret){require('fs').writeFileSync('electron/defaults.local.js','module.exports='+JSON.stringify({GOOGLE_CLIENT_ID:id,GOOGLE_CLIENT_SECRET:secret})+'\n');console.log('Google client added')}else{console.log('No Google client secrets: Drive sign-in stays off in this build')}"

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/gen-icon.js
          bunx vite build
          bunx electron-builder --publish always

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kozo-windows-release
          path: release/**